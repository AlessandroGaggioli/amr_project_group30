
# ==========================================
# COSTMAP GLOBALE (Visione d'insieme)
# ==========================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "map"
      robot_base_frame: "base_footprint"
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      always_send_full_costmap: false
      trinary_costmap: true
      unknown_cost_value: 255
      robot_radius: 0.28         # Raggio reale TIAGo (27cm) + 1cm margine
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.5
          obstacle_max_range: 5.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflate_unknown: false
        inflate_around_unknown: false
        # -- Tuning per spazi stretti --
        inflation_radius: 0.45    # Cuscinetto minimo attorno ai muri
        cost_scaling_factor: 12.0 # Decadimento brutale del pericolo

# ==========================================
# 3. COSTMAP LOCALE (Riflessi immediati)
# ==========================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "odom"
      robot_base_frame: "base_footprint"
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      rolling_window: true       # La mappa si muove col robot
      width: 3.0                 # Finestra 3x3 metri attorno al robot
      height: 3.0
      track_unknown_space: false
      transform_tolerance: 0.5
      always_send_full_costmap: false
      trinary_costmap: true
      robot_radius: 0.28
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.5  # In locale ci interessa solo chi è vicino
          obstacle_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # -- Tuning per spazi stretti --
        inflation_radius: 0.40    # Leggermente inferiore al globale
        cost_scaling_factor: 15.0 # Tolleranza altissima ai passaggi a filo muro


planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5